name: Verify recording (real capture)

# Records a marker stimulus through Cap's real Studio and Instant pipelines
# on macOS (ScreenCaptureKit + VideoToolbox) and checks every frame and
# audio marker against the host-clock truth. See
# crates/verify/tests/recording.rs.
#
# Pull requests run FAST on macOS 26, escalating ready engine/high-risk
# changes to FULL. Nightly and manual runs cover macOS 15 and 26.
# GitHub-hosted Macs exercise VideoToolbox capture; these jobs do not cover
# the software-only macOS capture fallback previously exercised on Blacksmith.
on:
  workflow_dispatch:
    inputs:
      repeat:
        description: "Runs of each case"
        default: "1"
      tier:
        description: "fast or full"
        default: "full"
      case_filter:
        description: "Case globs, comma-separated (empty runs all)"
        default: ""
      keep_artifacts:
        description: "Preserve recordings and raw crash snapshots for passing cases"
        type: boolean
        default: false
      soak_secs:
        description: "Adds the recording/soak/* cases at this length (seconds, at most 1800); set case_filter to recording/soak/* to run only them"
        default: ""
  schedule:
    - cron: "41 3 * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - ci/verify-ci
      - ci/verify-recording

concurrency:
  group: verify-recording-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event_name }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      runners: ${{ steps.scope.outputs.runners }}
      tier: ${{ steps.scope.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BEFORE: ${{ github.event.before }}
          INPUT_TIER: ${{ inputs.tier }}
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/changed.txt"
          hosted='["macos-15","macos-26"]'
          case "$EVENT" in
            schedule) run=true; runners="$hosted"; tier=full ;;
            workflow_dispatch)
              run=true
              tier="${INPUT_TIER:-full}"
              runners="$hosted" ;;
            *)
              if [[ "$EVENT" == pull_request ]]; then
                gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > "$files"
                max=3000
              elif [[ "$BEFORE" =~ ^0+$ ]]; then
                : > "$files"; echo Cargo.toml >> "$files"
                max=300
              else
                gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename' > "$files"
                max=300
              fi
              python3 scripts/verify/plan.py recording --files "$files" --max-files "$max" > "$RUNNER_TEMP/scope.txt"
              cat "$RUNNER_TEMP/scope.txt"
              run="$(sed -n 's/^run=//p' "$RUNNER_TEMP/scope.txt")"
              python3 scripts/verify/plan.py risk --files "$files" --summary "$GITHUB_STEP_SUMMARY" --output "$RUNNER_TEMP/risk.txt"
              if [[ "${DRAFT:-false}" != true ]] && { grep -qx 'escalate=true' "$RUNNER_TEMP/risk.txt" || grep -qx 'engine=true' "$RUNNER_TEMP/risk.txt"; }; then
                runners='["macos-26"]'; tier=full
              else
                runners='["macos-26"]'; tier=fast
              fi ;;
          esac
          {
            echo "run=$run"
            echo "runners=$runners"
            echo "tier=$tier"
          } >> "$GITHUB_OUTPUT"
          if [[ "$run" == true ]]; then
            echo "real capture: $tier tier on $runners" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "real capture: no recording code changed, nothing to run" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  real-capture:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.scope.outputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.soak_secs != '' && 180 || 45 }}
    env:
      CAP_VERIFY_CAPTURE: display
      CAP_VERIFY_REQUIRE_CAPTURE: "1"
      CAP_VERIFY_TIER: ${{ needs.scope.outputs.tier }}
      CAP_VERIFY_REPEAT: ${{ inputs.repeat || (github.event_name == 'schedule' && '3') || '1' }}
      CAP_VERIFY_CASE: ${{ inputs.case_filter || '' }}
      CAP_VERIFY_SOAK_SECS: ${{ inputs.soak_secs || '' }}
      CAP_VERIFY_KEEP: ${{ inputs.keep_artifacts && '1' || '' }}
      CAP_VERIFY_SCRATCH: ${{ github.workspace }}/verify-scratch
      CAP_VERIFY_REPORT_DIR: ${{ github.workspace }}/verify-report
      CAP_VERIFY_DUMP: ${{ github.workspace }}/verify-dump
      CAP_VERIFY_HOST: github-hosted
      # A case this runner cannot run fails, except system audio as the only
      # audio while the stimulus stays silent (see below).
      CAP_VERIFY_REQUIRE_SUPPORTED: "1"
      CAP_VERIFY_UNSUPPORTED_ALLOW: recording/instant/system-only
      # Hosted output devices give ScreenCaptureKit silence; system audio
      # is not covered. Keep the existing hosted-runner device selection.
      CAP_VERIFY_AUDIO_OUTPUT: ${{ matrix.runner == 'macos-26' && 'Null Audio Device' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: aarch64-apple-darwin
          prefix-key: v1-rust-verify-recording-${{ matrix.runner }}
          save-cache: "true"

      - uses: ./.github/actions/install-desktop-deps

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Native dependencies
        env:
          RUST_TARGET_TRIPLE: aarch64-apple-darwin
        run: node scripts/setup.js

      - name: Runner devices
        run: |
          sw_vers
          system_profiler SPDisplaysDataType SPAudioDataType 2>/dev/null | sed -n 1,80p
          sysctl hw.memsize hw.ncpu

      # Spotlight indexes the build and every recording the suite writes:
      # mds (priority 50) plus a dozen mdworkers averaged 1 to 1.8 of the 3
      # cores during the tests (ps samples, run 38736744971).
      - name: Disable Spotlight indexing
        run: |
          sudo mdutil -a -i off || true
          sudo mdutil -as || true

      - name: Build
        run: |
          start=$(date +%s)
          cargo build --locked -p cap-verify-stimulus
          cargo test --locked -p cap-verify --test recording --no-run
          echo "build seconds: $(( $(date +%s) - start ))"

      - name: Real-capture recording oracle
        run: |
          mkdir -p "$CAP_VERIFY_DUMP"
          # One-second process samples (CPU, scheduler priority) so an
          # environment failure can be attributed.
          (while sleep 1; do
            date -u +%H:%M:%S
            ps -A -o pid,pri,%cpu,comm -r | head -14
            for p in $(pgrep -f cap-verify-stimulus | head -1) $(pgrep -f 'deps/recording-' | head -1); do
              ps -M -p "$p" | awk 'NR == 1 || $4 > 0.5 || NR < 4' | cut -c1-90
            done
          done) > "$CAP_VERIFY_DUMP/ps.log" 2>&1 &
          top_pid=$!
          start=$(date +%s)
          set +e
          cargo test --locked -p cap-verify --test recording -- --nocapture
          status=$?
          set -e
          kill "$top_pid" || true
          echo "test seconds: $(( $(date +%s) - start ))"
          exit "$status"

      - name: Summary
        if: always()
        run: |
          python3 scripts/verify/summary.py --title "real capture ${{ matrix.runner }} ${{ needs.scope.outputs.tier }}" "$CAP_VERIFY_REPORT_DIR" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-recording-report-${{ matrix.runner }}
          path: ${{ github.workspace }}/verify-report
          if-no-files-found: ignore

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-recording-${{ matrix.runner }}
          path: |
            ${{ github.workspace }}/verify-report
            ${{ github.workspace }}/verify-dump
            ${{ github.workspace }}/verify-scratch
          if-no-files-found: ignore

  # The check to require: green when the change is out of scope or every
  # planned runner passed with at least the tier's case count.
  gate:
    name: Verify recording
    needs: [scope, real-capture]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/verify

      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.run == 'true'
        with:
          pattern: verify-recording-*
          path: ${{ runner.temp }}/reports

      - name: Verdict
        env:
          SCOPE: ${{ needs.scope.result }}
          RUN: ${{ needs.scope.outputs.run }}
          CAPTURE: ${{ needs.real-capture.result }}
          TIER: ${{ needs.scope.outputs.tier }}
          RUNNERS: ${{ needs.scope.outputs.runners }}
          CASE_FILTER: ${{ inputs.case_filter }}
        run: |
          if [[ "$SCOPE" != success ]]; then
            echo "scoping failed" >&2
            exit 1
          fi
          if [[ "$RUN" != true ]]; then
            echo "No recording code changed: nothing to verify." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$CAPTURE" != success ]]; then
            echo "real capture: macOS $CAPTURE ($TIER tier): see the runner jobs" >&2
            exit 1
          fi
          if [[ -n "$CASE_FILTER" ]]; then
            echo "case filter set: executed-case floor not applied"
            exit 0
          fi
          floor=0
          python3 scripts/verify/floor.py --recording --tier "$TIER" --runners "$RUNNERS" "$RUNNER_TEMP/reports" > "$RUNNER_TEMP/floor.txt" || floor=$?
          cat "$RUNNER_TEMP/floor.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ $floor != 0 ]]; then
            echo "::error::fewer real-capture cases ran than planned"
            exit 1
          fi
